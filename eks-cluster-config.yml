apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: kreptkon-cluster
  region: us-east-1

nodeGroups:
- name: ng-1
  instanceType: t3.small
  desiredCapacity: 2
  minSize: 1
  maxSize: 2
  volumeSize: 20

  iam:
    withAddonPolicies:
      cloudWatch: true
      imageBuilder: true

