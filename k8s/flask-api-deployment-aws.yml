apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-api-deployment
  labels:
    app: flask-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask-api
  template:
    metadata:
      labels:
        app: flask-api
    spec:
      containers:
        - name: flask-api
          image: 802096227177.dkr.ecr.us-east-1.amazonaws.com/kreptkon/flask-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5000

          # Environment variables from ConfigMap (includes ENABLE_DB: "true")
          envFrom:
            - configMapRef:
                name: flask-api-config

          env:
            # RDS connection string
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: DATABASE_URL

            # API credentials
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: flask-api-secret
                  key: API_KEY

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: flask-api-secret
                  key: JWT_SECRET

          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "200m"

          livenessProbe:
            httpGet:
              path: /hello
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /status
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 5
